schema_version: "1.1"
name: fires-on-implicit-signal
description: >
  The skill has to fire on how people actually talk, not on the words in its own
  description. Nobody types "enter phone mode". They say where they are.
tags: [triggering, formatting]
runs: 2
plugins: ["../.."]

execution:
  prompt: |
    heading out the door, walking to the station. what's left on the hooks work?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: phone-mode
    arm: with-only

  - name: one-decision
    type: regex
    pattern: "👉"
    match: "count:1"
    target: last_message
    weight: 2

  - name: no-em-dash
    type: regex
    pattern: "—"
    match: not_contains
    target: last_message

  - name: card-shape
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply is a phone card: outcome on the first line with no preamble,
      about 15 lines or fewer, emoji-header sections with bullets, no table, and a
      single next action at the end.

      FAIL on a preamble, a wall of prose, a table, or more than one decision asked
      of the reader.
