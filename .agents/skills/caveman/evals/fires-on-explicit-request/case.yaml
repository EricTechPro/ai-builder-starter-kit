schema_version: "1.1"
name: fires-on-explicit-request
description: >
  The plainest trigger there is: a user asking for fewer tokens in their own words,
  without saying the skill's name. If this does not fire, nothing will.
tags: [triggering, compression]
runs: 2
plugins: ["../.."]

execution:
  prompt: |
    can you use way less tokens when you answer me? now: why does a React component
    re-render every time its parent updates?
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: caveman
    arm: with-only
    weight: 3

  - name: actually-compressed
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply is visibly stripped: no pleasantries or preamble, few or no
      articles, fragments rather than full sentences, no restating of the question.

      FAIL if it opens with "Great question" or similar, hedges, narrates what it is
      about to do, or reads like ordinary prose of the length you would get without
      being asked to compress.

  - name: substance-survived
    type: llm
    focus: last_message
    weight: 3
    criteria: |
      PASS if the answer still conveys that re-rendering on parent update is React's
      default, and names at least one real mitigation (React.memo, useMemo, useCallback,
      or stabilising the prop reference).

      FAIL if compression cost it the actual answer, or if it inverted the meaning by
      dropping a negation.
