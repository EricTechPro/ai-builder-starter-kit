schema_version: "1.1"
name: near-miss-long-version
description: >
  An explicit ask for depth. Compression is this skill's whole job, so this is the
  request it must leave alone. "Normal mode" and "the long version" are the skill's
  own documented exit phrases.
tags: [triggering, near-miss]
runs: 2
plugins: ["../.."]

execution:
  prompt: |
    normal mode please, give me the long version: walk me through how a Postgres
    connection pool behaves when it hits max size, step by step
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill]

graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: caveman
    min: 0
    max: 0
    arm: both
    weight: 3

  - name: actually-detailed
    type: llm
    focus: last_message
    weight: 2
    criteria: |
      PASS if the reply gives real depth in ordinary English: full sentences, the
      queue/timeout/error path walked one stage at a time.

      FAIL if it is delivered in clipped caveman fragments with articles dropped.
      The user asked for the long version in normal mode; honouring that is the point.
